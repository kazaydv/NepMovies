<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NepMovies Player</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style2.css">
</head>
<body style="padding:0">
<div class="player-page" id="playerPage">
  <div class="player-ambient" id="ambient"></div>

  <div class="player-stage" id="stage">
    <div class="ptop">
      <button class="back" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <div><div class="ptitle" id="pTitle">Loading…</div><div class="psub" id="pSub"></div></div>
    </div>

    <div class="tapzone l" id="tapL"><div class="rip">−10s</div></div>
    <div class="tapzone r" id="tapR"><div class="rip">+10s</div></div>
    <div class="center-state" id="centerState"></div>
    <div class="spin" id="spin"></div>

    <div class="pctrl" id="pctrl">
      <div class="seek" id="seek">
        <div class="seek-track"><div class="seek-buffer" id="seekBuf"></div><div class="seek-fill" id="seekFill"></div></div>
        <div class="seek-knob" id="seekKnob"></div>
        <div class="seek-preview" id="seekPrev">0:00</div>
      </div>
      <div class="prow">
        <button class="pbtn" id="rwBtn" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="16" text-anchor="middle" font-size="7" fill="currentColor" stroke="none" font-weight="700">10</text></svg></button>
        <button class="pbtn main" id="playBtn" aria-label="Play/Pause"></button>
        <button class="pbtn" id="ffBtn" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="16" text-anchor="middle" font-size="7" fill="currentColor" stroke="none" font-weight="700">10</text></svg></button>
        <div class="vol">
          <button class="pbtn" id="muteBtn" aria-label="Mute"></button>
          <input type="range" id="volRange" min="0" max="100" value="100">
        </div>
        <span class="ptime" id="timeLabel">0:00 / 0:00</span>
        <div class="spacer"></div>
        <div class="pselect">
          <button id="speedBtn">1x</button>
          <div class="pmenu" id="speedMenu"></div>
        </div>
        <button class="pbtn" id="fsBtn" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg></button>
      </div>
    </div>

    <div id="resumeSlot"></div>
    <div id="errSlot"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="js/player.js"></script>
</body>
</html>
